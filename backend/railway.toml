# Copia deliberada del railway.toml de la raíz.
#
# Railway busca este archivo DENTRO del Root Directory del servicio, no en la
# raíz del repo. Este servicio tiene Root Directory = backend (tiene que
# tenerlo: el Dockerfile hace `COPY pyproject.toml uv.lock ./` y esos archivos
# viven acá, no en la raíz — con contexto en la raíz ese COPY fallaría
# siempre). Por eso el de la raíz nunca se leía: Railpack no lo encontraba,
# caía a auto-detección y erraba con "No start command detected", o levantaba
# sin healthcheckPath y sondeaba `/`.
#
# Los dos archivos conviven a propósito: Railway lee sólo el del Root
# Directory, así que esto funciona esté configurado en `backend` o en la raíz.
# Si cambiás uno, cambiá el otro.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
