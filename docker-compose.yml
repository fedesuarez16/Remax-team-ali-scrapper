services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - "./backend:/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: ./backend
    command: arq app.workers.worker.WorkerSettings
    env_file: ./backend/.env
    depends_on:
      - redis
    volumes:
      - "./backend:/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
